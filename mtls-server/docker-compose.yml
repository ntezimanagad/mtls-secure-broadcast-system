services:
  db:
    image: postgres:15
    container_name: mtls-postgres
    restart: always
    environment:
      POSTGRES_DB: mtls_db
      POSTGRES_USER: mtls_user
      POSTGRES_PASSWORD: mtls_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      
      test: ["CMD-SHELL", "pg_isready -U mtls_user -d mtls_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: mtls-server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8443:8443"
      - "6667:6667/udp"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mtls_db
      SPRING_DATASOURCE_USERNAME: mtls_user
      SPRING_DATASOURCE_PASSWORD: mtls_pass
    volumes:
      - ./certs:/app/certs

volumes:
  postgres_data:
